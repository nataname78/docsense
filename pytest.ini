[pytest]
# Configuration pytest pour le projet rag-doc-analyzer

# Où chercher les tests
testpaths = tests

# Racine du projet (ajoute la racine au PYTHONPATH pour que 'from src.X' marche)
pythonpath = .

# Pattern des fichiers de test
python_files = test_*.py

# Pattern des fonctions de test
python_functions = test_*

# Options par défaut
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Désactive les warnings de dépréciation de libs externes (langchain, etc.)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers personnalisés
markers =
    slow: marque les tests lents (>5s, ex : tests nécessitant un appel LLM)
    integration: marque les tests d'intégration (multi-modules)